# Self-contained local development infrastructure for the Kuvox API ALONE.
# The API itself is NOT started here — run `make watch` (or `dotnet watch run`) for that.
#
# Postgres is owned exclusively by this service (the ai-service has no DB access).
# Redis / RabbitMQ / SeaweedFS are also provided here so the API can be developed
# standalone without the ai-service repo checked out.
#
# >>> If you develop BOTH api/ and ai-service/ together, do NOT run this file. <<<
# Use the workspace-root docker-compose.yml (`cd .. && make up`) instead — it brings up
# a single shared infra set. This file and the ai-service compose both publish Redis
# (6379), RabbitMQ (5672/15672) and SeaweedFS (8333), so running more than one infra
# set at once collides on those host ports. Run exactly one set, never two.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kuvox
      POSTGRES_PASSWORD: kuvox
      POSTGRES_DB: kuvox
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kuvox -d kuvox"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: kuvox
      RABBITMQ_DEFAULT_PASS: kuvox
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ---- Object Storage --------------------------------
  seaweedfs-master:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs_master
    restart: unless-stopped
    ports:
      - "9333:9333"    # Master HTTP
      - "19333:19333"    # Master gRPC
    command: master -mdir=/data
    volumes:
      - seaweedfs_master:/data
  
  seaweedfs-volume:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs-volume
    restart: unless-stopped
    ports:
      - "8123:8123"
    command: volume -mserver=seaweedfs-master:9333 -dir=/data -port=8123
    volumes:
      - seaweedfs_volume:/data
    depends_on:
      - seaweedfs-master

  seaweedfs-s3:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs_s3
    restart: unless-stopped
    ports:
      - "8333:8333"    # S3-compatible API endpoint
    command: s3 -config=/etc/seaweedfs/s3.json -filer=seaweedfs-filer:8888
    volumes:
      - ../infra/seaweedfs:/etc/seaweedfs:ro
    depends_on:
      - seaweedfs-filer

  seaweedfs-filer:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs_filer
    restart: unless-stopped
    ports:
      - "8888:8888"
    command: filer -master=seaweedfs-master:9333
    volumes:
      - seaweedfs_filer:/data
    depends_on:
      - seaweedfs-master

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  seaweedfs_master:
  seaweedfs_volume:
  seaweedfs_filer:
