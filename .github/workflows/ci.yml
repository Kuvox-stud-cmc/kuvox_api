name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: |
          dotnet restore api.csproj
          dotnet restore Tests/Tests.csproj

      - name: Build
        run: |
          dotnet build api.csproj --no-restore --configuration Release
          dotnet build Tests/Tests.csproj --no-restore --configuration Release

      - name: Test
        run: dotnet test Tests/Tests.csproj --no-build --configuration Release --verbosity normal
